<!DOCTYPE html>

        .card:hover{box-shadow:0 4px 12px #00000018;}
        .card a{text-decoration:none;color:#222;}
        .card img{width:100%;height:220px;object-fit:cover;}
        .card-text{padding:16px;text-align:center;}
        .card-text h3{font-size:20px;margin-bottom:8px;}
