<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活丰富展示 | Maggy Sun</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:system-ui, sans-serif;line-height:1.7;max-width:1100px;margin:0 auto;padding:30px 20px;color:#222;}
        .back-link a{display:inline-block;margin-bottom:30px;color:#2c3e50;font-size:17px;text-decoration:none;}
        .back-link a:hover{text-decoration:underline;}

        /* 深蓝色标题框 */
        .page-title-bar{
            background-color:#2c3e50;
            color:#ffffff;
            text-align:center;
            padding:22px;
            border-radius:6px;
            margin-bottom:36px;
        }
        .page-title-bar h1{
            font-size:32px;
            margin:0;
        }

        /* 自动滚动外层容器 */
        .cert-scroll-wrap{
            width:100%;
            overflow:hidden;
            padding:10px 0 20px 0;
            margin-bottom:30px;
        }
        /* 滚动动画容器，复制一份图片实现无缝循环 */
        .scroll-inner{
            display:flex;
            gap:12px;
            animation: autoScroll 25s linear infinite;
        }
        /* 鼠标悬浮暂停滚动 */
        .cert-scroll-wrap:hover .scroll-inner{
            animation-play-state: paused;
        }
        .scroll-inner img{
            height:160px;
            border-radius:6px;
            object-fit:contain;
            flex-shrink:0;
        }
        /* 自动滚动动画 */
        @keyframes autoScroll {
            0% {transform: translateX(0);}
            100% {transform: translateX(-50%);}
        }

        .item{margin-bottom:32px;}
        .item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .time{font-size:22px;font-weight:bold;color:#1a2533;}
        .title{font-size:22px;font-weight:bold;text-align:center;flex:1;padding:0 12px;}
        .tag{font-size:22px;font-weight:bold;color:#1a2533;}
        .content{padding-left:4px;font-size:18px;}
    </style>
</head>
<body>
    <div class="back-link">
        <a href="index.html">← 返回首页</a>
    </div>

   <div class="page-title-bar">
        <h1>课余生活</h1>
    </div>

    <div class="cert-scroll-wrap">
        <div class="scroll-inner">
            <!-- 第一组6张证书 -->
            <img src="tennis1.jpg" alt="证书">

            <img src="tennis3.jpg" alt="证书">

           <img src="tennis1.jpg" alt="证书">

            <img src="tennis3.jpg" alt="证书">
            <img src="life2.jpg" alt="证书">

                  <img src="life6.jpg" alt="证书">
              </div>
          </div>
        </div>
    </div>

</body>
</html>
