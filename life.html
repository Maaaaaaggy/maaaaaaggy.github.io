<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活丰富展示 | Maggy Sun</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:system-ui, sans-serif;line-height:1.7;max-width:1100px;margin:0 auto;padding:30px 20px;color:#222;}
        .back-link a{display:inline-block;margin-bottom:30px;color:#2c3e50;font-size:17px;text-decoration:none;}
        .back-link a:hover{text-decoration:underline;}
        h1{font-size:32px;margin-bottom:36px;color:#1a2533;}
        h2{font-size:26px;margin:30px 0 16px 0;color:#2c3e50;}
        .content{font-size:18px;}
        .photo-group{margin:16px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .photo-group img{width:100%;border-radius:8px;object-fit:cover;}
    </style>
</head>
<body>
    <div class="back-link">
        <a href="index.html">← 返回首页</a>
    </div>

    <h1>课余生活</h1>

    <!-- 培养兴趣板块 -->
    <h2>培养兴趣</h2>
    <div class="content">
        <p>网球，游泳</p>
        <div class="photo-group">
            <!-- 将你的兴趣照片上传仓库，修改下面src里的文件名 -->
            <img src="tennis1.jpg" alt="网球活动照片">
            <img src="tennis3.jpg" alt="网球活动照片">
            <img src="life2.jpg" alt="网球活动照片">
            <img src="life3.jpg" alt="网球活动照片">
            <!-- 如需更多照片，继续复制上面一行img标签即可 -->
        </div>
    </div>

    <!-- 志愿服务板块 -->
    <h2>志愿服务</h2>
    <div class="content">
        <p>参与多项志愿活动，获得相关志愿证书：</p>
        <div class="photo-group">
            <!-- 上传志愿证书图片，修改src文件名 -->
            <img src="life4.jpg" alt="志愿服务证书1">
            <img src="life5.jpg" alt="志愿服务证书2">
            <img src="life6.jpg" alt="志愿服务证书2">
        </div>
    </div>

</body>
</html>
