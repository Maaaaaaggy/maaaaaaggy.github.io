<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活丰富展示 | Maggy Sun</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:system-ui, sans-serif;line-height:1.7;max-width:1100px;margin:0 auto;padding:30px 20px;color:#222;}
        .back-link a{display:inline-block;margin-bottom:30px;color:#2c3e50;font-size:17px;text-decoration:none;}
        .back-link a:hover{text-decoration:underline;}

        /* 深蓝色标题框 */
        .page-title-bar{
            background-color:#2c3e50;
            color:#ffffff;
            text-align:center;
            padding:22px;
            border-radius:6px;
            margin-bottom:36px;
        }
        .page-title-bar h1{
            font-size:32px;
            margin:0;
        }

       /* ===== 静态图片容器，不滚动，少量图片使用 ===== */
       .static-img-group{
           width:100%;
           padding:10px 0 20px 0;
           margin-bottom:30px;
           display:flex;
           gap:14px;
           flex-wrap:wrap; /* 空间不够自动换行，不会横向溢出 */
       }
        .static-img-group img{
           height:160px;
           object-fit:contain;
           border-radius:6px;
           flex-shrink:0;
           background:#fff;
       }

        .item{margin-bottom:32px;}
        .item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .time{font-size:22px;font-weight:bold;color:#1a2533;}
        .title{font-size:22px;font-weight:bold;text-align:center;flex:1;padding:0 12px;}
        .tag{font-size:22px;font-weight:bold;color:#1a2533;}
        .content{padding-left:4px;font-size:18px;}
    </style>
</head>
<body>
    <div class="back-link">
        <a href="index.html">← 返回首页</a>
    </div>

   <div class="page-title-bar">
        <h1>课余生活</h1>
    </div>
  <!-- 兴趣爱好板块 -->
    <h2>兴趣爱好</h2>
    <div class="content">
        <p>网球；游泳：</p>
        <div class="static-img-group">
            <img src="tennis2.jpg" alt="证书">
            <img src="tennis3.jpg" alt="证书">
            <img src="life2.jpg" alt="证书">
            <img src="life3.jpg" alt="证书">
        </div>
   </div>


    <!-- 志愿服务板块 -->
    <h2>志愿服务</h2>
    <div class="content">
        <p>参与多项志愿活动，获得相关志愿证书：</p>
          <div class="static-img-group">
              <img src="life4.jpg" alt="证书">
              <img src="life5.jpg" alt="证书">
              <img src="life6.jpg" alt="证书">
          </div>
    </div>

</body>
</html>
